<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Scientific Calculator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    transition: 0.3s;
}

.calculator {
    width: 360px;
    background: #1b1b1b;
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

#display {
    width: 100%;
    height: 80px;
    border: none;
    border-radius: 15px;
    font-size: 32px;
    text-align: right;
    padding: 10px;
    margin-bottom: 15px;
    background: #000;
    color: white;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 60px;
    border: none;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

.num {
    background: #2b2b2b;
    color: yellow;
}

.op {
    background: #ff9500;
    color: yellow;
}

.top {
    background: #a5a5a5;
}

.history {
    margin-top: 15px;
    background: #111;
    border-radius: 10px;
    padding: 10px;
    color: white;
    max-height: 150px;
    overflow-y: auto;
}

.history div {
    border-bottom: 1px solid #333;
    padding: 5px;
    font-size: 14px;
}

.toggle {
    margin-bottom: 10px;
    text-align: right;
}

.toggle button {
    border-radius: 10px;
    width: auto;
    padding: 8px 12px;
    background: #444;
    color: white;
}

.light-mode {
    background: #f2f2f2;
}

.light-mode .calculator {
    background: white;
}

.light-mode #display {
    background: #ddd;
    color: white;
}

.light-mode .num {
    background: #e0e0e0;
    color: black;
}

.light-mode .history {
    background: #eee;
    color:white;
}
</style>
</head>

<body>

<div class="calculator">

    <div class="toggle">
        <button onclick="toggleTheme()">Theme</button>
    </div>

    <input type="text" id="display" disabled>

    <div class="buttons">
        <button class="top" onclick="clearDisplay()">C</button>
        <button class="top" onclick="backspace()">⌫</button>
        <button class="top" onclick="add('%')">%</button>
        <button class="op" onclick="add('/')">÷</button>

        <button class="num" onclick="add('7')">7</button>
        <button class="num" onclick="add('8')">8</button>
        <button class="num" onclick="add('9')">9</button>
        <button class="op" onclick="add('*')">×</button>

        <button class="num" onclick="add('4')">4</button>
        <button class="num" onclick="add('5')">5</button>
        <button class="num" onclick="add('6')">6</button>
        <button class="op" onclick="add('-')">−</button>

        <button class="num" onclick="add('1')">1</button>
        <button class="num" onclick="add('2')">2</button>
        <button class="num" onclick="add('3')">3</button>
        <button class="op" onclick="calculate()">=</button>

        <button class="num" onclick="add('0')">0</button>
        <button class="num" onclick="add('.')">.</button>
        <button class="num" onclick="squareRoot()">√</button>
        <button class="op" onclick="add('+')">+</button>

        <button class="num" onclick="square()">x²</button>
        <button class="num" onclick="cube()">x³</button>
        <button class="num" onclick="sinValue()">sin</button>
        <button class="num" onclick="cosValue()">cos</button>
    </div>

    <div class="history" id="history"></div>
</div>

<script>
let display = document.getElementById("display");
let historyDiv = document.getElementById("history");

loadHistory();

function add(value) {
    let last = display.value.slice(-1);

    if ("+-*/%".includes(last) && "+-*/%".includes(value)) {
        return;
    }

    display.value += value;
}

function clearDisplay() {
    display.value = "";
}

function backspace() {
    display.value = display.value.slice(0, -1);
}

function calculate() {
    try {
        let exp = display.value;
        let result = Function('"use strict";return (' + exp + ')')();

        addHistory(exp + " = " + result);
        display.value = result;
    } catch {
        display.value = "Error";
    }
}

function squareRoot() {
    try {
        let value = parseFloat(display.value);
        display.value = Math.sqrt(value);
    } catch {
        display.value = "Error";
    }
}

function square() {
    try {
        let value = parseFloat(display.value);
        display.value = value * value;
    } catch {
        display.value = "Error";
    }
}

function cube() {
    try {
        let value = parseFloat(display.value);
        display.value = value * value * value;
    } catch {
        display.value = "Error";
    }
}

function sinValue() {
    try {
        let value = parseFloat(display.value);
        display.value = Math.sin(value);
    } catch {
        display.value = "Error";
    }
}

function cosValue() {
    try {
        let value = parseFloat(display.value);
        display.value = Math.cos(value);
    } catch {
        display.value = "Error";
    }
}

function addHistory(text) {
    let div = document.createElement("div");
    div.textContent = text;

    historyDiv.prepend(div);

    saveHistory();
}

function saveHistory() {
    localStorage.setItem("calcHistory", historyDiv.innerHTML);
}

function loadHistory() {
    historyDiv.innerHTML = localStorage.getItem("calcHistory") || "";
}

function toggleTheme() {
    document.body.classList.toggle("light-mode");
}

// Keyboard support
window.addEventListener("keydown", function(e) {
    if (!isNaN(e.key) || "+-*/.%".includes(e.key)) {
        add(e.key);
    }
    else if (e.key === "Enter") {
        calculate();
    }
    else if (e.key === "Backspace") {
        backspace();
    }
    else if (e.key === "Escape") {
        clearDisplay();
    }
});
</script>

</body>
</html>
